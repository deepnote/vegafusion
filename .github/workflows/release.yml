name: 'Release'
on:
  workflow_dispatch:
    inputs:
      pypi_environment:
        description: 'PyPI environment to deploy to'
        required: true
        type: choice
        options:
          - pypi
          - testpypi
        default: testpypi

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' vegafusion-python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-wheels-*
          path: wheels/
          merge-multiple: true
      - name: List downloaded wheels
        run: ls -lR wheels/
      - name: Create Release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.get_version.outputs.version }}" \
            --title "Release v${{ steps.get_version.outputs.version }}" \
            --notes "" \
            wheels/*

  publish-to-pypi:
    name: Publish Python wheels to ${{ inputs.pypi_environment }}
    runs-on: ubuntu-latest
    needs: [create-release]
    environment:
      name: ${{ inputs.pypi_environment }}
      url: ${{ inputs.pypi_environment == 'pypi' && 'https://pypi.org/p/deepnote-vegafusion' || 'https://test.pypi.org/p/deepnote-vegafusion' }}
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-wheels-*
          path: dist/
          merge-multiple: true
      - name: List files to be uploaded
        run: ls -lR dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: ${{ inputs.pypi_environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: true
          verbose: true
