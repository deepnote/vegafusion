name: 'PR checks'
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      build-all-platforms: false
    permissions:
      contents: read
      actions: write
